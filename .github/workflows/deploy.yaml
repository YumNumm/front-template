name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify deployment inputs
        run: |
          if [[ ! -f .env.enc.json ]]; then
            echo "::error file=.env.enc.json::Encrypted deployment secrets are missing. Generate and commit .env.enc.json after applying the GCP KMS stack."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in the production environment."
            exit 1
          fi

      - name: Install tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Decrypt deployment secrets
        run: mise exec -- sops --decrypt .env.enc.json > /tmp/env.json

      - name: Upload backend secrets
        run: mise exec -- pnpm --filter @front-template/backend exec wrangler secret bulk /tmp/env.json

      - name: Apply D1 migrations
        run: mise exec -- pnpm --filter @front-template/backend exec wrangler d1 migrations apply front-template-db --remote

      - name: Deploy backend
        run: mise exec -- pnpm --filter @front-template/backend deploy

      - name: Deploy frontend
        run: mise exec -- pnpm --filter @front-template/frontend deploy

      - name: Remove decrypted secrets
        if: ${{ always() }}
        run: rm -f /tmp/env.json
