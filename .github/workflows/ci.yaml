name: CI

on:
  pull_request:
  push:

permissions: {}

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: gitleaks pinact zizmor

      - name: Run gitleaks
        id: gitleaks
        background: true
        run: gitleaks git --redact=100 --baseline-path .gitleaks.baseline.json

      - name: Run pinact
        id: pinact
        background: true
        run: pinact run --check .github/workflows/*.yaml

      - name: Run zizmor
        id: zizmor
        background: true
        run: zizmor .github/workflows

      - name: Wait for background jobs to complete
        wait:
          - gitleaks
          - pinact
          - zizmor

  check:
    name: Project checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check
